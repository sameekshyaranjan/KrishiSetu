services:
  # 1. Redis In-Memory Store & BullMQ Queue Broker
  redis:
    image: redis:7-alpine
    container_name: krishisetu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - krishisetu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js / Express REST API & Real-Time Socket.io Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishisetu-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - krishisetu-network

  # 3. Background BullMQ Cron & Price Alert Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishisetu-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - krishisetu-network
    command: ["node", "workers/cronWorker.js"]

  # 4. Production Nginx Reverse Proxy & React Vite Single-Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishisetu-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - krishisetu-network

  # 5. Optional Local MongoDB (Activated via --profile local-db for offline development)
  mongodb:
    image: mongo:7-jammy
    container_name: krishisetu-mongodb
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - krishisetu-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  backend_uploads:

networks:
  krishisetu-network:
    driver: bridge
