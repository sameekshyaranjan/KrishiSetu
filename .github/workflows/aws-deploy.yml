name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'aws/**'
      - 'docker-compose.yml'
      - 'Dockerrun.aws.json'
      - '.github/workflows/aws-deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPOSITORY: krishisetu-backend
  ECR_FRONTEND_REPOSITORY: krishisetu-frontend
  ECS_CLUSTER: production-krishisetu-cluster
  ECS_SERVICE: krishisetu-task-service-03Sirewp
  ECS_TASK_DEFINITION: aws/task-definition.json

jobs:
  deploy:
    name: Build, Push to ECR, and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover and Inspect ECS Services
        id: inspect-ecs
        run: |
          echo "Inspecting ECS Cluster: ${{ env.ECS_CLUSTER }}"
          SERVICES=$(aws ecs list-services --cluster ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} --query "serviceArns[]" --output text)
          echo "Found services in cluster: $SERVICES"

          if [ -n "$SERVICES" ] && [ "$SERVICES" != "None" ]; then
            DETECTED_SERVICE=$(echo $SERVICES | awk '{print $1}' | awk -F'/' '{print $NF}')
            echo "Auto-detected ECS service: $DETECTED_SERVICE"
            echo "ECS_SERVICE=$DETECTED_SERVICE" >> $GITHUB_ENV
          else
            echo "WARNING: No active services returned from AWS ECS for cluster ${{ env.ECS_CLUSTER }}."
            echo "Proceeding with default: ${{ env.ECS_SERVICE }}"
          fi

          echo "Inspecting AWS Secrets Manager:"
          aws secretsmanager list-secrets --region ${{ env.AWS_REGION }} --query "SecretList[].Name" --output text || true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Backend image to Amazon ECR
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push Frontend image to Amazon ECR
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render Backend Container in Task Definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: krishisetu-backend
          image: ${{ steps.build-backend.outputs.image }}

      - name: Render Frontend Container in Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: krishisetu-frontend
          image: ${{ steps.build-frontend.outputs.image }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Monitor ECS Task Rollout & Diagnostics
        run: |
          echo "Waiting 45 seconds for tasks to initialize..."
          sleep 45

          echo "=== Recent ECS Service Events ==="
          aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --region ${{ env.AWS_REGION }} --query "services[0].events[0:6]" --output table

          echo "=== Stopped Tasks Diagnostics ==="
          STOPPED_TASKS=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} --desired-status STOPPED --query "taskArns[0:3]" --output text)
          if [ -n "$STOPPED_TASKS" ] && [ "$STOPPED_TASKS" != "None" ]; then
            for task in $STOPPED_TASKS; do
              echo "Diagnosing Task: $task"
              aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} --tasks $task --query "tasks[0].{taskArn:taskArn,stoppedReason:stoppedReason,stopCode:stopCode,containers:containers[*].{name:name,exitCode:exitCode,reason:reason}}" --output json
            done
          fi

          echo "=== Running Tasks ==="
          aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} --desired-status RUNNING --output table
